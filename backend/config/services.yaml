# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Decorar el procesador de eliminación de API Platform para implementar Soft Delete globalmente
    App\State\SoftDeleteProcessor:
        bind:
            $persistProcessor: '@api_platform.doctrine.orm.state.persist_processor'
            $removeProcessor: '@api_platform.doctrine.orm.state.remove_processor'
        tags:
            - { name: 'api_platform.state_processor', priority: 100 }

    # Configuración del Cliente S3 para MinIO
    app.minio_client:
        class: 'Aws\S3\S3Client'
        arguments:
            -
                endpoint: '%env(MINIO_ENDPOINT)%'
                region: 'us-east-1'
                version: 'latest'
                use_path_style_endpoint: true
                credentials:
                    key: '%env(MINIO_ACCESS_KEY)%'
                    secret: '%env(MINIO_SECRET_KEY)%'

    # Alias para inyectar el filesystem fácilmente
    League\Flysystem\FilesystemOperator: '@oneup_flysystem.loggex_storage_filesystem'

    # Auto-tag de adapters del catálogo oficial. Cualquier clase que implemente
    # CatalogoSourceAdapterInterface se etiqueta para ser descubierta por el
    # comando `app:catalogo:refresh` y por el ingest service.
    _instanceof:
        App\Catalogo\Source\CatalogoSourceAdapterInterface:
            tags: ['app.catalogo.source']

    # Iterador inyectable de todos los adapters tagueados.
    App\Catalogo\Source\CatalogoSourceAdapterRegistry:
        arguments:
            $adapters: !tagged_iterator app.catalogo.source

    # Scraper HTTP de TodoFP (Fase 1.6). Produce los ~229 ciclos del catálogo
    # nacional con metadata + URL del RD del BOE. Los módulos detallados los
    # añade BoeRdEnricher después leyendo el RD/Currículo del BOE.
    App\Catalogo\Source\TodoFpHttpAdapter:
        tags:
            - { name: app.catalogo.source }
