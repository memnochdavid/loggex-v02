framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: loggex_jobs
                    group: workers
                    consumer: '%env(default:default_consumer:HOSTNAME)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            # Jobs fallidos permanecen en MariaDB para inspección (messenger:failed:show).
            failed: 'doctrine://default?queue_name=failed'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # Jobs propios de la aplicación
            App\Message\PublishMercureUpdate: async

parameters:
    default_consumer: worker
