security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Firewall unificado para Login y API (Stateful / Sesión)
        main:
            lazy: true
            provider: app_user_provider

            # Configuración de Login JSON
            json_login:
                check_path: api_login
                username_path: email
                password_path: password

            # Configuración de Logout
            logout:
                path: api_logout
                target: api_logout_success

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api$,      roles: PUBLIC_ACCESS } # Permitir Swagger UI
        - { path: ^/api/docs,  roles: PUBLIC_ACCESS } # Permitir Docs JSON
        - { path: ^/api,       roles: IS_AUTHENTICATED_FULLY } # Bloquear el resto

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
