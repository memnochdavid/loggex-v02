security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Jerarquía de roles del proyecto.
    # SUPERADMIN incluye los privilegios de ADMIN: cualquier IsGranted('ROLE_ADMIN')
    # se cumple también para un SuperAdmin sin tener que enumerar ambos.
    # NO se inclu­ye ADMIN→PROFESOR ni PROFESOR→ALUMNO porque son roles con
    # responsabilidades distintas (un admin no es un profesor; un profesor no
    # es un alumno). Si en el futuro algún recurso quiere "todos los roles
    # autenticados", se usa IS_AUTHENTICATED_FULLY o se construye con OR explícito.
    role_hierarchy:
        ROLE_SUPERADMIN: [ROLE_ADMIN]

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Firewall unificado para Login y API (Stateful / Sesión)
        main:
            lazy: true
            provider: app_user_provider

            # Configuración de Login JSON
            json_login:
                check_path: api_login
                username_path: email
                password_path: password

            # Configuración de Logout
            logout:
                path: api_logout
                target: api_logout_success

            # Importante: No ponemos 'stateless: true' aquí.
            # Al ser stateful, la sesión creada en el login se reutiliza en las peticiones subsiguientes.

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/logout_success, roles: PUBLIC_ACCESS }
        - { path: ^/api,       roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
