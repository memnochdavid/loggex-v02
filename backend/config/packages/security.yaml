security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Define la jerarquía: El SUPERADMIN tiene todo lo que tiene el ADMIN, y más.
    role_hierarchy:
        ROLE_ALUMNO:      ROLE_USER
        ROLE_PROFESOR:    ROLE_USER
        ROLE_ADMIN:       [ROLE_PROFESOR, ROLE_ALUMNO]
        ROLE_SUPERADMIN:  [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
            logout:
                path: api_logout
                target: api_logout_success # Redirigir aquí tras logout (evita redirección a / que falla CORS)

    access_control:
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
