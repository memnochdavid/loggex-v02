framework:
    cache:
        # Cache "app" respaldado por Redis (vía predis/predis).
        # Usado por CacheInterface para stats de usuario, contadores, etc.
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_URL)%'

        # Pools dedicados (namespaces independientes, misma conexión Redis).
        pools:
            # Datos volátiles con TTL corto (home stats, contadores de no leídos).
            cache.user_stats:
                adapter: cache.adapter.redis
                default_lifetime: 60
