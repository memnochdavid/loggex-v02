services:
  # Proxy Inverso (HTTPS)
  caddy:
    image: caddy:2-alpine
    container_name: loggex-caddy
    restart: unless-stopped
    ports:
      - "8888:80"
      - "8443:443"
      - "9443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - minio
      - mercure

  database:
    image: mariadb:10.11
    container_name: loggex-db
    environment:
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backup_tfg_full.sql:/docker-entrypoint-initdb.d/init.sql:z
    security_opt:
      - apparmor:unconfined

  minio:
    image: minio/minio:latest
    container_name: loggex-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: loggex-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  mercure:
    image: dunglas/mercure
    container_name: loggex-mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: '${MERCURE_JWT_SECRET:-!ChangeThisMercureHubSecret!MakeItLongEnoughFor256Bits!}'
      MERCURE_SUBSCRIBER_JWT_KEY: '${MERCURE_JWT_SECRET:-!ChangeThisMercureHubSecret!MakeItLongEnoughFor256Bits!}'
      MERCURE_PUBLISHER_JWT_ALG: 'HS256'
      MERCURE_SUBSCRIBER_JWT_ALG: 'HS256'
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins https://localhost:8443 https://localhost:8888
        anonymous
        heartbeat 30s
    volumes:
      - mercure_data:/data
      - mercure_config:/config

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: loggex-backend:latest
    container_name: loggex-backend
    volumes:
      - ./backend:/var/www/html:z
    depends_on:
      - database
      - minio
      - redis
      - mercure
    environment: &backend_env
      DATABASE_URL: "mysql://app_user:app_password@database:3306/app_db?serverVersion=10.11.15-MariaDB&charset=utf8mb4"
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?'
      # Configuración MinIO para el Backend
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "minio_admin"
      MINIO_SECRET_KEY: "minio_password"
      MINIO_BUCKET: "loggex-data"
      # Redis (cache y cola Messenger)
      REDIS_URL: "redis://redis:6379"
      MESSENGER_TRANSPORT_DSN: "redis://redis:6379/loggex_jobs"
      # Mercure
      MERCURE_URL: "http://mercure/.well-known/mercure"
      MERCURE_PUBLIC_URL: "https://localhost:8443/.well-known/mercure"
      MERCURE_JWT_SECRET: "${MERCURE_JWT_SECRET:-!ChangeThisMercureHubSecret!MakeItLongEnoughFor256Bits!}"
    security_opt:
      - apparmor:unconfined

  # Worker Messenger: consume jobs async desde Redis.
  # Reusa la imagen de backend (mismo Dockerfile) — no duplicamos build.
  # Sin container_name para permitir múltiples réplicas (--scale worker=N).
  worker:
    image: loggex-backend:latest
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=256M -vv
    volumes:
      - ./backend:/var/www/html:z
    depends_on:
      - database
      - redis
      - mercure
    environment: *backend_env
    restart: unless-stopped
    deploy:
      replicas: 2
    security_opt:
      - apparmor:unconfined

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loggex-frontend
    volumes:
      - ./frontend:/app:z
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - HMR_HOST=localhost
      - HMR_PORT=8443
    depends_on:
      - backend
    security_opt:
      - apparmor:unconfined

volumes:
  db_data:
  caddy_data:
  caddy_config:
  minio_data:
  redis_data:
  mercure_data:
  mercure_config:
