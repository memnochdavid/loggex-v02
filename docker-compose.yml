version: '3.8'

services:
  # Proxy Inverso (HTTPS)
  caddy:
    image: caddy:2-alpine
    container_name: loggex-caddy
    restart: unless-stopped
    ports:
      - "8888:80"
      - "8443:443"
      - "9443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:z
      - caddy_data:/data:z
      - caddy_config:/config:z
    depends_on:
      - frontend
      - backend

  database:
    image: mariadb:10.11
    container_name: loggex-db
    environment:
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql:z
      # Importar automáticamente el backup al iniciar el contenedor por primera vez
      - ./backup_tfg.sql:/docker-entrypoint-initdb.d/init.sql:z
    security_opt:
      - apparmor:unconfined

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loggex-backend
    volumes:
      - ./backend:/var/www/html:z
    depends_on:
      - database
    environment:
      # Conexión a MariaDB
      DATABASE_URL: "mysql://app_user:app_password@database:3306/app_db?serverVersion=10.11.15-MariaDB&charset=utf8mb4"
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?'
    security_opt:
      - apparmor:unconfined

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loggex-frontend
    volumes:
      - ./frontend:/app:z
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - HMR_HOST=localhost
      - HMR_PORT=8443
    depends_on:
      - backend
    security_opt:
      - apparmor:unconfined

volumes:
  db_data:
  caddy_data:
  caddy_config:
